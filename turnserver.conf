# Activer les fonctionnalités de base
fingerprint
lt-cred-mech

# Définir le domaine (realm) – il doit être identique dans ton client WebRTC
realm=notif-clientcanal.com

# Définir un utilisateur statique pour l'authentification TURN
user=test:test

# Spécifier l'adresse IP publique (et locale) du VPS
listening-ip=10.10.10.10
relay-ip=10.10.10.10
external-ip=10.10.10.10

# Ports d'écoute (nous n'utilisons pas TLS pour simplifier)
listening-port=3478
#tls-listening-port=5349

# Plage de ports pour les connexions relayées
min-port=49152
max-port=65535

# Activer un niveau de log détaillé
verbose

# Définir un cli-password non vide pour éviter l'erreur (pour l'interface de commande, même si tu ne l'utilises pas)
cli-password=somecli
